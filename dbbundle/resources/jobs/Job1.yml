resources:
  jobs:
    bundle_dummy:
      name: bundle-dummy
      tasks:
        - task_key: bundle-job
          notebook_task:
            notebook_path: ../../src/notebooks/notebook1.ipynb
            source: WORKSPACE
          environment_key: Default
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED